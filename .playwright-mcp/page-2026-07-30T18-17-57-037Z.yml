        - heading "* API Key" [level=2] [ref=e103]
        - paragraph [ref=e104]:
          - text: Issued by
          - code [ref=e105]: POST /authorize
          - text: upon a successful email + password challenge. Returned as the
          - code [ref=e106]: auth
          - text: field. With
          - code [ref=e107]: "no_expire: false"
          - text: (default) the key expires after
          - strong [ref=e108]: 2 hours
          - text: ; set
          - code [ref=e109]: "no_expire: true"
          - text: for a non-expiring key. To revoke a key call
          - code [ref=e110]: POST /deauthorize
          - text: .
        - blockquote [ref=e111]:
          - paragraph [ref=e112]:
            - code [ref=e113]: /authorize
            - text: is rate-limited — cache and reuse the key rather than calling it before every request.
        - paragraph [ref=e114]:
          - text: (Use
          - link "/authorize" [ref=e115] [cursor=pointer]:
            - /url: "#/authentication/AuthenticationLogin"
          - text: to obtain an API Key)
        - heading "* Consumer Key / Secret" [level=2] [ref=e116]
        - paragraph [ref=e117]:
          - text: A permanent key/secret pair tied to your account (not to your password). Consumer keys support IP-based restrictions and can be revoked individually — they are the recommended method for production and are
          - strong [ref=e118]: required
          - text: for
          - code [ref=e119]: /mail/send
          - text: .
        - blockquote [ref=e120]:
          - paragraph [ref=e121]:
            - text: The
            - code [ref=e122]: consumerSecret
            - text: is returned
            - strong [ref=e123]: only at creation time
            - text: and cannot be retrieved later — store it securely.
        - paragraph [ref=e124]:
          - text: (Use
          - link "/user/consumerKeys" [ref=e125] [cursor=pointer]:
            - /url: "#/consumerkey/createConsumerKey"
          - text: to create a Consumer Key / Secret pair)
